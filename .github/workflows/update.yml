name: Update institutional data

on:
  schedule:
    # 10:30 UTC = 台灣時間 18:30
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Update institutional data
        run: python scripts/update_institutional.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/institutional.json data/institutional.js data/institutional_history.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Update institutional data"
          git push
